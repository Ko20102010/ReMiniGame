<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Animation Preview</title><style>body{margin:0;background:linear-gradient(#2980b9,#a0e2f5);font-family:system-ui;color:#fff}main{max-width:1000px;margin:auto;padding:20px}.panel{background:#102c4dcc;border:2px solid #ffd166;border-radius:18px;padding:16px}canvas{width:100%;height:520px;background:linear-gradient(#97d975 55%,#487e2b 55%);border-radius:12px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button{border:1px solid #ffd166;background:#183153;color:#fff;border-radius:999px;padding:9px 14px;font-weight:700}button.active{background:#ffd166;color:#183153}</style></head><body><main><h1>Chibi Animation Preview</h1><div class="panel"><div class="controls" id="controls"></div><canvas id="preview"></canvas></div></main><script type="module">import{SpriteAnimator,ANIMATION_STATES}from'./js/sprites.js';const canvas=document.querySelector('#preview'),c=canvas.getContext('2d'),s=new SpriteAnimator,controls=document.querySelector('#controls');let state='run',dpr=1;for(const x of ANIMATION_STATES){const b=document.createElement('button');b.textContent=x;b.onclick=()=>{state=x;document.querySelectorAll('button').forEach(v=>v.classList.toggle('active',v===b))};if(x===state)b.className='active';controls.append(b)}function resize(){dpr=Math.min(3,devicePixelRatio||1);const r=canvas.getBoundingClientRect();canvas.width=r.width*dpr;canvas.height=r.height*dpr;c.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function frame(ms){const t=ms/1000,w=canvas.clientWidth,names=['Pecorine','Karyl','Kokkoro','Yuuki','Mimi'];c.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);names.forEach((n,i)=>{const x=(i+.5)*w/names.length;s.draw(c,n,x,230,t,{state,scale:1.35,phase:i*.7,carry:state==='carry'});c.fillStyle='#fff';c.textAlign='center';c.font='700 15px system-ui';c.fillText(n,x,300)});c.textAlign='start';requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
